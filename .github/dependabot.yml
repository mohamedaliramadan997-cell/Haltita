# Dependabot (architecture.md §11): npm security updates only, checked weekly.
# Version-bump PRs are off (limit 0) because Expo packages must move together
# through `npx expo install`; security-update PRs are not affected by the limit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
